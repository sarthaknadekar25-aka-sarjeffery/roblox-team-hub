<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply · Team Applications</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="glow glow-one" aria-hidden="true"></div>
  <div class="glow glow-two" aria-hidden="true"></div>
  <div class="orb orb-one" aria-hidden="true"></div>
  <div class="orb orb-two" aria-hidden="true"></div>
  <div class="orb orb-three" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="index.html">Team Applications</a>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="apply.html" class="nav-cta">Apply</a>
    </nav>
  </header>

  <main class="form-page">
    <section class="form-intro">
      <p class="eyebrow">Application</p>
      <h1>Tell us what you can build.</h1>
      <p>
        Complete the form below. Your application will be sent to the team Discord channel.
        Only send links you are comfortable sharing.
      </p>
    </section>

    <form id="applicationForm" class="application-form" novalidate>
      <div class="progress-container" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Form completion">
        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
      </div>

      <div class="form-grid">
        <label class="field field-wide">
          <span>Full name <span class="required-mark" aria-hidden="true">*</span></span>
          <input name="fullName" type="text" autocomplete="name" required placeholder="Your name" />
        </label>

        <label class="field">
          <span>Discord username <span class="required-mark" aria-hidden="true">*</span></span>
          <input name="discord" type="text" autocomplete="off" required placeholder="username or username#0000" />
        </label>

        <label class="field">
          <span>Email <span class="required-mark" aria-hidden="true">*</span></span>
          <input name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
        </label>

        <label class="field field-wide">
          <span>Role you are applying for <span class="required-mark" aria-hidden="true">*</span></span>
          <select name="role" required>
            <option value="">Select a role</option>
            <option>Frontend / Full-stack Developer</option>
            <option>Backend Developer</option>
            <option>Product / UI Designer</option>
            <option>Content / Community Creator</option>
            <option>Music Creator / DJ</option>
            <option>Game Developer</option>
            <option>3D Artist / Modeler</option>
            <option>Video Editor</option>
            <option>Content Writer</option>
            <option>Other creator role</option>
          </select>
        </label>

        <label class="field">
          <span>Experience level <span class="required-mark" aria-hidden="true">*</span></span>
          <select name="experienceLevel" required>
            <option value="">Select experience</option>
            <option>Beginner</option>
            <option>Intermediate</option>
            <option>Advanced</option>
            <option>Professional</option>
          </select>
        </label>

        <label class="field">
          <span>Location <span class="optional-mark" aria-hidden="true">(optional)</span></span>
          <input name="location" type="text" autocomplete="address-level2" placeholder="City, country, or remote" />
        </label>

        <label class="field field-wide">
          <span>Skills or tech stack <span class="required-mark" aria-hidden="true">*</span></span>
          <input name="skills" type="text" required placeholder="JavaScript, React, Figma, Blender..." />
        </label>

        <label class="field">
          <span>Timezone <span class="required-mark" aria-hidden="true">*</span></span>
          <input name="timezone" type="text" required placeholder="GMT+5:30, EST..." />
        </label>

        <label class="field">
          <span>Weekly availability <span class="required-mark" aria-hidden="true">*</span></span>
          <input name="availabilityHours" type="text" required placeholder="5 hours/week" />
        </label>

        <label class="field">
          <span>Age <span class="optional-mark" aria-hidden="true">(optional)</span></span>
          <input name="age" type="number" min="13" max="100" placeholder="Your age" />
        </label>

        <label class="field field-wide">
          <span>Past teams experience <span class="optional-mark" aria-hidden="true">(optional)</span></span>
          <textarea name="pastTeams" rows="3" placeholder="What teams have you worked with? What was your role?"></textarea>
        </label>

        <label class="field field-wide">
          <span>Portfolio, GitHub, or project links <span class="required-mark" aria-hidden="true">*</span></span>
          <textarea name="portfolioLinks" rows="3" required placeholder="https://github.com/you, https://yourportfolio.com"></textarea>
        </label>

        <label class="field field-wide">
          <span>Social links <span class="optional-mark" aria-hidden="true">(optional)</span></span>
          <input name="socialLinks" type="text" placeholder="Twitter, LinkedIn, YouTube, etc." />
        </label>

        <label class="field field-wide">
          <span>Why do you want to join this team? <span class="required-mark" aria-hidden="true">*</span></span>
          <textarea name="motivation" rows="5" required placeholder="Tell us what excites you, what you want to learn, and what you can contribute. (minimum 50 characters)"></textarea>
          <div class="char-counter">
            <span id="motivationCounter">0</span> / 50 minimum
          </div>
        </label>

        <label class="field field-wide">
          <span>How did you hear about us? <span class="optional-mark" aria-hidden="true">(optional)</span></span>
          <select name="hearAbout">
            <option value="">Select one</option>
            <option>Friend / referral</option>
            <option>Social media</option>
            <option>Discord community</option>
            <option>Search engine</option>
            <option>Job board</option>
            <option>Other</option>
          </select>
        </label>
      </div>

      <div id="formStatus" class="form-status" role="status" aria-live="polite"></div>

      <button id="submitBtn" class="button button-primary submit-button" type="submit">
        Send application
      </button>
    </form>
  </main>

  <footer>
    <p>Team Applications · Built for serious creators.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
