# Render Blueprint — deploys roblox-team-hub as a web service.
# Push this repo to GitHub, then Render → New → Blueprint → select repo.
services:
  - type: web
    name: roblox-team-hub
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_PASSWORD
        sync: false # set a strong password in the Render dashboard
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DISCORD_INVITE_URL
        value: https://discord.gg/empireforge
